<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400"
     role="img" aria-labelledby="t d">
<title id="t">The master bus signal chain</title>
<desc id="d">Pads routed to Out 1 and 2, joined by the delay and reverb returns,
pass into the Character chain, then the master EQ and filter, then the
compressor, then a safety limiter, then master volume, then out. The Character
chain, the EQ and the compressor are the three stages this patch gives you
control of. The limiter is untouched.</desc>
<style>
  .bx  { fill: #F4F2ED; stroke: #D8D4CC; }
  .yrs { fill: #8C3A2E14; stroke: #8C3A2E; }
  .tx  { fill: #1A1815; font: 600 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .sub { fill: #6E6A62; font: 400 11px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .acc { fill: #8C3A2E; font: 700 11px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .ln  { stroke: #6E6A62; stroke-width: 1.5; }
  .hd  { fill: #6E6A62; }
  @media (prefers-color-scheme: dark) {
    .bx  { fill: #1C1A17; stroke: #35322C; }
    .yrs { fill: #D98A7820; stroke: #D98A78; }
    .tx  { fill: #E8E4DC; } .sub { fill: #9A948A; }
    .acc { fill: #D98A78; } .ln { stroke: #9A948A; } .hd { fill: #9A948A; }
  }
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M0,0 L9,4.5 L0,9 z" class="hd"/></marker></defs>

<rect class="bx" x="40"  y="8" width="215" height="42"/>
<text class="tx" x="147" y="27" text-anchor="middle">pads routed to Out 1/2</text>
<text class="sub" x="147" y="42" text-anchor="middle">everything you play</text>

<rect class="bx" x="305" y="8" width="215" height="42"/>
<text class="tx" x="412" y="27" text-anchor="middle">delay and reverb</text>
<text class="sub" x="412" y="42" text-anchor="middle">returns</text>

<path class="ln" d="M147,50 v14 h133 v18" fill="none" marker-end="url(#a)"/>
<path class="ln" d="M412,50 v14 h-133"    fill="none"/>

<rect class="yrs" x="170" y="84" width="220" height="42" stroke-width="2"/>
<text class="tx"  x="280" y="102" text-anchor="middle">CHARACTER CHAIN</text>
<text class="acc" x="280" y="118" text-anchor="middle">four effect slots on MIDI</text>

<path class="ln" d="M280,126 v18" fill="none" marker-end="url(#a)"/>
<rect class="yrs" x="170" y="146" width="220" height="42" stroke-width="2"/>
<text class="tx"  x="280" y="164" text-anchor="middle">EQ AND FILTER</text>
<text class="acc" x="280" y="180" text-anchor="middle">parameters on MIDI</text>

<path class="ln" d="M280,188 v18" fill="none" marker-end="url(#a)"/>
<rect class="yrs" x="170" y="208" width="220" height="42" stroke-width="2"/>
<text class="tx"  x="280" y="226" text-anchor="middle">COMPRESSOR</text>
<text class="acc" x="280" y="242" text-anchor="middle">parameters on MIDI</text>

<path class="ln" d="M280,250 v18" fill="none" marker-end="url(#a)"/>
<rect class="bx" x="170" y="270" width="220" height="38"/>
<text class="tx"  x="280" y="287" text-anchor="middle">safety limiter</text>
<text class="sub" x="280" y="301" text-anchor="middle">no control of it</text>

<path class="ln" d="M280,308 v18" fill="none" marker-end="url(#a)"/>
<rect class="bx" x="170" y="328" width="220" height="30"/>
<text class="tx" x="280" y="348" text-anchor="middle">master volume</text>

<path class="ln" d="M280,358 v18" fill="none" marker-end="url(#a)"/>
<text class="tx" x="280" y="393" text-anchor="middle">Out 1/2</text>
</svg>
